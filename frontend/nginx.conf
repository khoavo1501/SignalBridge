server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback (routes /gateways/:id, /admin)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api và /ws do edge nginx (deploy/nginx) lo liệu ở M1;
  # giữ proxy trực tiếp ở đây để frontend chạy độc lập khi dev/debug.
  location /api/ {
    proxy_pass http://backend:8000;
  }

  location /ws {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
}
